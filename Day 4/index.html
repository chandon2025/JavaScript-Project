<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCale - Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <nav><b>Quickcal</b><a href="try it"></a></nav>
        <h1>fast calculation any time</h1>
        <p>+ - * / this logic give result</p>
    </header>
    <section id="cale" class="card">
        <div class="row">
            <input id="a" type="number" placeholder="First number"/>
            <select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select>
            <input id="b" type="number" placeholder="Second number">
        </div>
        <button id="go">Calculated</button>
        <div id="out" class="out">= 0</div>
    </section>
    <section class="features">
        <div><h3>Fast</h3><p>Instant result</p></div>
        <div><h3>Simple</h3><p>No signup</p></div>
        <div><h3>Free</h3><p>Forever free</p></div>
    </section>
    <footer>QuickCale 2026</footer>
    <script src="script.js"></script>
</body>
</html>
