
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyFlow - Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>MoneyFlow</h2>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Transactions</a>
            <a href="#">Reports</a>
        </nav>
    </header>

    <main>
        <section class="welcome">
            <h1>Welcome Back!</h1>
            <p>Manage your money, achieve your goals.</p>
        </section>

        <section class="summary">
            <div class="card">
                <h3>Total Balance</h3>
                <h2 id="balance">$0</h2>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <h2 id="income">$0</h2>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <h2 id="expense">$0</h2>
            </div>
        </section>

        <section class="transaction">
            <h2>Add Transaction</h2>

            <form id="transactionForm">
                <input type="text" id="description" placeholder="Transaction name" required>

                <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>

                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section class="history">
            <h2>Recent Transactions</h2>
            <div id="transactionList"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 MoneyFlow. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
