# Deploy the Day 12 frontend to GitHub Pages
name: Deploy Day 12 frontend to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "day 12/frontend/**"
      - ".github/workflows/static.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_API_URL: ${{ vars.DAY12_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "day 12/frontend/package-lock.json"
      - name: Install frontend dependencies
        run: npm ci --prefix "day 12/frontend"
      - name: Build frontend
        run: npm run build --prefix "day 12/frontend"
      - name: Add SPA route fallback
        run: cp "day 12/frontend/dist/index.html" "day 12/frontend/dist/404.html"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "day 12/frontend/dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
